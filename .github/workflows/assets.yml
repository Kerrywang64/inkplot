name: assets
on:
  push:
    branches: [main]
    paths: ['scripts/collage.js', 'scripts/showcase.mjs', '.github/workflows/assets.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i -D playwright && npx playwright install --with-deps chromium
      - run: node scripts/showcase.mjs
      - run: node measure.mjs && node diversity.mjs
      - name: commit assets
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f assets/banner.png assets/gallery.png
          git diff --cached --quiet || git commit -m 'chore: re-render showcase assets'
          git push
