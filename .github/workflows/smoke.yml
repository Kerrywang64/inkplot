name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            args: --density 2 --contrast 4 --texture 3 --palette cool
          - name: default
            args: ""
          - name: heavy
            args: --density 9 --contrast 9 --texture 9 --palette warm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pillow numpy

      - name: Generate (${{ matrix.name }})
        run: |
          python3 scripts/generate.py --count 8 --seed 7 --size 320 --colors 20 \
            ${{ matrix.args }} --out art.json --contact sheet-${{ matrix.name }}.png

      - name: Build gallery
        run: python3 scripts/gallery.py --art art.json --out gallery.html

      - name: Verify output
        run: |
          python3 - <<'PY'
          import json, os, sys
          a = json.load(open("art.json"))
          assert len(a) == 8, f"expected 8 pieces, got {len(a)}"
          for it in a:
              for k in ("src", "cn", "en", "pattern", "color", "inks", "dials"):
                  assert k in it, f"missing key {k}"
              assert it["src"].startswith("data:image/png;base64,"), "bad data-uri"
              assert " · " in it["cn"], f"title not derived from image: {it['cn']}"
          assert len({i["cn"] for i in a}) > 1, "all titles identical"
          h = os.path.getsize("gallery.html")
          assert h > 50_000, f"gallery too small: {h}B"
          print(f"OK  {len(a)} pieces, gallery {h//1024}KB")
          print("titles:", ", ".join(i["cn"] for i in a[:4]))
          PY

      - name: Determinism (same seed → same bytes)
        run: |
          python3 scripts/generate.py --count 4 --seed 42 --size 240 --colors 16 --out a1.json
          python3 scripts/generate.py --count 4 --seed 42 --size 240 --colors 16 --out a2.json
          cmp a1.json a2.json && echo "OK deterministic"

      - uses: actions/upload-artifact@v4
        with:
          name: sheet-${{ matrix.name }}
          path: sheet-${{ matrix.name }}.png

  assets:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pillow numpy

      - name: Render README assets
        run: python3 scripts/make_assets.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain assets)" ]; then
            git add assets/banner.png assets/sheet.png
            git commit -m "chore(assets): regenerate README previews [skip ci]"
            git push origin HEAD:main
          else
            echo "assets unchanged"
          fi
